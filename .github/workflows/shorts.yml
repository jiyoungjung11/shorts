name: 쇼츠 생성

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '쇼츠 주제 (예: 경복궁 야경)'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ffmpeg 설치
        run: sudo apt-get install -y ffmpeg

      - name: Google 서비스 계정 키 저장
        run: |
          echo '${{ secrets.GOOGLE_SA_KEY_JSON }}' > /tmp/sa-key.json

      - name: 의존성 설치
        run: npm install

      - name: Puppeteer 의존성 설치
        run: |
          npx puppeteer browsers install chrome

      - name: 쇼츠 파이프라인 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SA_KEY_PATH: /tmp/sa-key.json
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          KLING_ACCESS_KEY: ${{ secrets.KLING_ACCESS_KEY }}
          KLING_SECRET_KEY: ${{ secrets.KLING_SECRET_KEY }}
          FFMPEG_PATH: ffmpeg
        run: node run.mjs "${{ github.event.inputs.topic }}"

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-${{ github.run_number }}
          path: output/
          retention-days: 7
