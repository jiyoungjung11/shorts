name: 쇼츠 생성

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '쇼츠 주제 (예: 경복궁 야경) — scenario_file 미입력 시 Claude가 자동 생성'
        required: true
        type: string
      scenario_file:
        description: 'Claude와 대화로 확정한 시나리오 파일명 (예: 성수동_서울숲) — 비워두면 자동 생성'
        required: false
        type: string
      mode:
        description: '실행 모드'
        required: true
        type: choice
        default: 'preview_cut'
        options:
          - preview_cut
          - preview
          - full
      cut_numbers:
        description: '미리볼 컷 번호 (preview_cut 모드, 예: 1 또는 1,2,3)'
        required: false
        default: '1'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ffmpeg 설치
        if: ${{ github.event.inputs.mode == 'full' }}
        run: sudo apt-get install -y ffmpeg

      - name: Google 서비스 계정 키 저장
        run: |
          echo '${{ secrets.GOOGLE_SA_KEY_JSON }}' > /tmp/sa-key.json

      - name: 의존성 설치
        run: npm install

      - name: Puppeteer 브라우저 설치
        run: npx puppeteer browsers install chrome

      - name: 특정 컷 미리보기 (1~3장, ~1분)
        if: ${{ github.event.inputs.mode == 'preview_cut' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SA_KEY_PATH: /tmp/sa-key.json
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          FFMPEG_PATH: ffmpeg
        run: |
          SCENARIO_FILE="${{ github.event.inputs.scenario_file }}"
          CUTS="${{ github.event.inputs.cut_numbers }}"
          if [ -n "$SCENARIO_FILE" ] && [ -f "scenarios/${SCENARIO_FILE}.json" ]; then
            node run.mjs "${{ github.event.inputs.topic }}" --scenario "scenarios/${SCENARIO_FILE}.json" --from scenario --to overlay --cut "$CUTS"
          else
            node run.mjs "${{ github.event.inputs.topic }}" --from scenario --to overlay --cut "$CUTS"
          fi

      - name: 전체 이미지 미리보기 (10장, ~5분)
        if: ${{ github.event.inputs.mode == 'preview' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SA_KEY_PATH: /tmp/sa-key.json
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          FFMPEG_PATH: ffmpeg
        run: |
          SCENARIO_FILE="${{ github.event.inputs.scenario_file }}"
          if [ -n "$SCENARIO_FILE" ] && [ -f "scenarios/${SCENARIO_FILE}.json" ]; then
            node run.mjs "${{ github.event.inputs.topic }}" --scenario "scenarios/${SCENARIO_FILE}.json" --from scenario --to overlay
          else
            node run.mjs "${{ github.event.inputs.topic }}" --from scenario --to overlay
          fi

      - name: 전체 파이프라인 (시나리오 + 이미지 + 오버레이 + 영상 + 조립)
        if: ${{ github.event.inputs.mode == 'full' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SA_KEY_PATH: /tmp/sa-key.json
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          KLING_ACCESS_KEY: ${{ secrets.KLING_ACCESS_KEY }}
          KLING_SECRET_KEY: ${{ secrets.KLING_SECRET_KEY }}
          FFMPEG_PATH: ffmpeg
        run: |
          SCENARIO_FILE="${{ github.event.inputs.scenario_file }}"
          if [ -n "$SCENARIO_FILE" ] && [ -f "scenarios/${SCENARIO_FILE}.json" ]; then
            node run.mjs "${{ github.event.inputs.topic }}" --scenario "scenarios/${SCENARIO_FILE}.json"
          else
            node run.mjs "${{ github.event.inputs.topic }}"
          fi

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-${{ github.run_number }}-${{ github.event.inputs.mode }}
          path: output/
          retention-days: 7
